plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	// Mod Menu, compile-only: the Drifter settings screen (user's choice, 2026-10-16). Not needed to run.
	maven { url = "https://maven.terraformersmc.com/releases/" }
	// EMF and ETF (and Farmer's Delight), compile-only: Touch'n Motion on Drifters (client/render/DrifterTouchNMotionHook). Not needed to run.
	exclusiveContent {
		forRepository {
			maven { url = "https://api.modrinth.com/maven" }
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()
}

// Drifter: Civilizations (milestone 22, docs/CIVILIZATION.md): an addon mod in this same project (the user, 2026-10-21:
// "same repo, call it Drifter: Civilizations"). Its own source sets and its own jar; it builds against Drifter, so a
// change to Drifter that would break it fails this build at once. The game launches here (runClient, runServer) load
// both mods, so every test runs them together.
sourceSets {
	civ {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	civClient {
		compileClasspath += sourceSets.civ.compileClasspath + sourceSets.civ.output + sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.civ.runtimeClasspath + sourceSets.client.runtimeClasspath
	}
}

loom {
	mods {
		"drifter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"drifter_civ" {
			sourceSet sourceSets.civ
			sourceSet sourceSets.civClient
		}
	}

	runs {
		client {
			source sourceSets.civClient
		}
		server {
			source sourceSets.civ
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: Mod Menu's settings button for Drifter. Compile-only, so Drifter runs with or without it.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Optional: EMF's animation hook, for Touch'n Motion on Drifters. Compile-only; only loaded when EMF is there.
	modCompileOnly "maven.modrinth:entity-model-features:${project.emf_version}"
	modCompileOnly "maven.modrinth:entitytexturefeatures:${project.etf_version}"

	// Optional: Farmer's Delight, for cooking (compat/farmersdelight). Compile-only, so Drifter runs with or without it.
	// The dev game launches only load it when asked: ./gradlew runServer -PfarmersDelight, or DRIFTER_FD=1 (tests run both ways).
	modCompileOnly "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
	def delight = project.hasProperty("delight") || System.getenv("DRIFTER_DELIGHT") == "1"
	if (project.hasProperty("farmersDelight") || System.getenv("DRIFTER_FD") == "1" || delight) {
		modLocalRuntime "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
	}

	// Optional: the five Farmer's Delight addons (More Delight, Ocean's Delight, Thai's Delight, Crate Delight, Storage
	// Delight). Thai's Delight is compile-only too (its mortar recipe class is used directly); the rest only run in dev.
	// Dev launches load them with ./gradlew runServer -Pdelight, or DRIFTER_DELIGHT=1 (this also loads Farmer's Delight).
	modCompileOnly "maven.modrinth:muffins-thais-delight:${project.thais_delight_version}"
	modCompileOnly "maven.modrinth:muffins-oven-api:${project.muffins_oven_api_version}"
	if (delight) {
		modLocalRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"
		modLocalRuntime "maven.modrinth:cardinal-components-api:${project.cca_version}"
		modLocalRuntime "maven.modrinth:more-delight:${project.more_delight_version}"
		modLocalRuntime "maven.modrinth:oceans-delight:${project.oceans_delight_version}"
		modLocalRuntime "maven.modrinth:crate-delight:${project.crate_delight_version}"
		modLocalRuntime "maven.modrinth:storage-delight:${project.storage_delight_version}"
	}
	// Thai's Delight 2.0.0 touches a client-only class in its common init (ThaiDelightFabric.onInitialize, line 97:
	// NoClassDefFoundError net.minecraft.client.multiplayer.ClientLevel), so it cannot load on a dedicated server (runServer,
	// the smoke tests). It loads on runClient: add it there with DRIFTER_THAI=1 (or -Pthai) together with DRIFTER_DELIGHT=1.
	if (!delight && (project.hasProperty("thai") || System.getenv("DRIFTER_THAI") == "1")) {
		logger.warn("DRIFTER_THAI / -Pthai is set without DRIFTER_DELIGHT=1 / -Pdelight: Thai's Delight is NOT loaded.")
	}
	if (delight && (project.hasProperty("thai") || System.getenv("DRIFTER_THAI") == "1")) {
		modLocalRuntime "maven.modrinth:muffins-thais-delight:${project.thais_delight_version}"
		modLocalRuntime "maven.modrinth:muffins-oven-api:${project.muffins_oven_api_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

processCivResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The addon's jar, next to Drifter's (same version: the addon asks for exactly this Drifter).
def civJar = tasks.register("civJar", Jar) {
	from sourceSets.civ.output
	from sourceSets.civClient.output
	archiveBaseName = "drifter_civilizations"
	archiveClassifier = "dev"
	destinationDirectory = layout.buildDirectory.dir("devlibs")
}

def remapCivJar = tasks.register("remapCivJar", net.fabricmc.loom.task.RemapJarTask) {
	inputFile = civJar.flatMap { it.archiveFile }
	archiveBaseName = "drifter_civilizations"
	classpath.from(sourceSets.main.output, sourceSets.client.output)
}

tasks.named("build") {
	dependsOn remapCivJar
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
