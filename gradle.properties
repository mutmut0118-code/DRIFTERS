# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# Versions from the official fabric-example-mod template, branch 1.21.1.
# Loom is pinned to 1.17 (template uses 1.18) because Loom 1.18 needs a Java 25 JDK
# to run Gradle; 1.17 is the newest Loom that runs on Java 21. See CLAUDE.md.
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.23.39
group=com.dinglebob.drifter

# Dependencies
fabric_api_version=0.116.17+1.21.1
modmenu_version=11.0.3
# Compile-only (Modrinth maven): EMF and ETF for the optional Touch'n Motion bridge.
emf_version=3.3.11-fabric-1.21
etf_version=7.2.5-fabric-1.21
# Optional (Modrinth maven): Farmer's Delight Refabricated, for cooking in the kitchen (compat/farmersdelight).
farmers_delight_version=1.21.1-3.3.6
# Optional (Modrinth maven): the five Farmer's Delight addons, dev runs only (DRIFTER_DELIGHT=1); Thai's also compile-only.
more_delight_version=26.04.30-1.21-fabric
oceans_delight_version=1.0.3+fabric.1.21.1
thais_delight_version=fabric-1.21.1+2.0.0
muffins_oven_api_version=Fabric-1.21.1+0.1.0
crate_delight_version=26.07.20-1.21-fabric
storage_delight_version=26.07.01-1.21-fabric
cloth_config_version=15.0.140+fabric
cca_version=6.1.3
